<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Zoomies — dog preview</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #8a8f94;
      }
      body.dark {
        background: #1d2a33;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: 10px;
        left: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 520px;
      }
      #panel button {
        font:
          12px system-ui,
          sans-serif;
        padding: 4px 8px;
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 10px;
        font:
          12px ui-monospace,
          monospace;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="panel"></div>
    <div id="status">Dog preview</div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
